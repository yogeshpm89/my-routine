name: Build & Deploy Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build APK & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || yes | sdkmanager --licenses 2>/dev/null || true

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web App & Sync to Capacitor Android
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY || 'AIzaSyDiKIF0tf4ce7Qi2jo62npKr5prjOGgknY' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'my-routine-app-3f631.firebaseapp.com' }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'my-routine-app-3f631' }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || 'my-routine-app-3f631.firebasestorage.app' }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || '323086149363' }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID || '1:323086149363:web:a45b49ec2dd42008dfb986' }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID || 'G-6HR63Z8SGS' }}
        run: npm run build:mobile

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Release & Debug APKs
        working-directory: ./android
        run: |
          ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Stage APK for Release Distribution
        run: |
          mkdir -p release-apks
          if [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk release-apks/my-routine-release.apk
          elif [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk release-apks/my-routine-release.apk
          elif [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk release-apks/my-routine-release.apk
          fi

          # Update exact file size in out/version.json for accurate in-app modal display
          if [ -f release-apks/my-routine-release.apk ]; then
            APK_SIZE=$(stat -c%s release-apks/my-routine-release.apk 2>/dev/null || stat -f%z release-apks/my-routine-release.apk || echo 0)
            echo "Generated APK size: $APK_SIZE bytes"
            node -e "
              const fs = require('fs');
              if (fs.existsSync('out/version.json')) {
                const v = JSON.parse(fs.readFileSync('out/version.json', 'utf8'));
                if ($APK_SIZE > 0) v.fileSizeBytes = $APK_SIZE;
                fs.writeFileSync('out/version.json', JSON.stringify(v, null, 2));
                console.log('Updated out/version.json with exact file size.');
              }
            "
          fi

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-routine-android-apk
          path: |
            release-apks/my-routine-release.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: latest
          name: "My Routine Latest Release (v1.2.0)"
          body: "Official Android APK release for My Routine. Download and tap to install on your phone."
          files: release-apks/my-routine-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Web App & Version Manifest to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_ROUTINE_APP_3F631 || secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          # Firebase Spark plan strictly forbids .apk binaries on Hosting.
          # Ensure out/ only contains web assets (HTML, CSS, JS, version.json).
          rm -rf out/download/*.apk || true
          find out -name "*.apk" -delete || true

          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Deploying via Firebase Service Account..."
            echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
            npx -y firebase-tools@latest deploy --only hosting --project my-routine-app-3f631
          elif [ -n "$FIREBASE_TOKEN" ]; then
            echo "Deploying via FIREBASE_TOKEN..."
            npx -y firebase-tools@latest deploy --only hosting --project my-routine-app-3f631 --token "$FIREBASE_TOKEN"
          else
            echo "::warning title=Firebase Secret Not Configured::Neither FIREBASE_SERVICE_ACCOUNT nor FIREBASE_TOKEN found."
          fi
